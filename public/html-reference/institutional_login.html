<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400;1,6..72,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-primary": "#bac8dc",
                    "surface-variant": "#e2e3df",
                    "on-tertiary-fixed": "#261900",
                    "surface-container": "#edeeea",
                    "on-primary-container": "#778598",
                    "on-surface-variant": "#44474c",
                    "surface-container-highest": "#e2e3df",
                    "inverse-on-surface": "#f0f1ed",
                    "secondary-fixed-dim": "#afc9ea",
                    "on-tertiary-container": "#a17f3b",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#d1e4ff",
                    "outline": "#74777d",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#0f1c2c",
                    "primary-fixed-dim": "#bac8dc",
                    "on-surface": "#1a1c1a",
                    "on-secondary-container": "#48617e",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#2f312e",
                    "secondary": "#47607e",
                    "tertiary-container": "#261900",
                    "surface-bright": "#f9faf5",
                    "on-secondary-fixed": "#001d36",
                    "on-secondary-fixed-variant": "#2f4865",
                    "tertiary-fixed-dim": "#e9c176",
                    "surface-container-low": "#f3f4f0",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-background": "#1a1c1a",
                    "secondary-container": "#c2dcff",
                    "primary": "#000000",
                    "on-primary-fixed": "#0f1c2c",
                    "on-error": "#ffffff",
                    "surface-dim": "#d9dad6",
                    "outline-variant": "#c4c6cc",
                    "background": "#f9faf5",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#5d4201",
                    "on-primary-fixed-variant": "#3a4859",
                    "error": "#ba1a1a",
                    "tertiary": "#000000",
                    "surface-container-high": "#e8e8e4",
                    "surface": "#f9faf5",
                    "tertiary-fixed": "#ffdea5",
                    "surface-tint": "#525f71",
                    "primary-fixed": "#d6e4f9"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Newsreader", "serif"],
                    "body": ["Manrope", "sans-serif"],
                    "label": ["Manrope", "sans-serif"],
                    "serif": ["Cormorant Garamond", "serif"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .watermark-text {
            user-select: none;
            pointer-events: none;
            opacity: 0.03;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col relative overflow-hidden">
<!-- Subtle Background Texture/Watermark -->
<div class="absolute inset-0 z-0 flex items-center justify-center overflow-hidden">
<div class="watermark-text text-[15rem] leading-none rotate-[-12deg] whitespace-nowrap">
            Sovereign Ledger Sovereign Ledger Sovereign Ledger
        </div>
</div>
<!-- Main Login Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-8 py-12 w-full max-w-md mx-auto">
<!-- Branding Header -->
<div class="text-center mb-16">
<div class="mb-4 inline-flex items-center justify-center p-3 rounded-full bg-primary-container text-tertiary-fixed">
<span class="material-symbols-outlined !text-3xl" style="font-variation-settings: 'FILL' 1;">
                    shield_person
                </span>
</div>
<h1 class="font-headline italic text-4xl text-primary-container tracking-tight">Sovereign Ledger</h1>
<p class="font-body text-secondary mt-3 text-xs uppercase tracking-[0.2em]">Institutional Wealth Portal</p>
</div>
<!-- Login Form Section -->
<section class="w-full space-y-8">
<div class="space-y-6">
<!-- Underline style inputs as per design system -->
<div class="relative group">
<label class="font-label text-[10px] uppercase tracking-widest text-secondary block mb-1" for="identifier">Entity Identifier</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 focus:ring-0 focus:border-tertiary-fixed-dim text-on-surface transition-all placeholder:text-outline-variant/50" id="identifier" name="identifier" placeholder="Ex: SL-9928-ALPHA" type="text"/>
</div>
<div class="relative group">
<label class="font-label text-[10px] uppercase tracking-widest text-secondary block mb-1" for="credential">Security Credential</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 focus:ring-0 focus:border-tertiary-fixed-dim text-on-surface transition-all placeholder:text-outline-variant/50" id="credential" name="credential" placeholder="••••••••••••" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant hover:text-secondary">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
</div>
<!-- MFA Indicator / Security Note -->
<div class="flex items-start gap-3 p-4 bg-surface-container-low rounded-sm">
<span class="material-symbols-outlined text-secondary text-sm">verified_user</span>
<p class="text-[11px] leading-relaxed text-secondary font-medium">
                    Encrypted session. Two-factor authentication will be required upon identification.
                </p>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-sm font-label text-sm uppercase tracking-widest hover:bg-slate-800 transition-all flex items-center justify-center gap-2 group">
                    Begin Verification
                    <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</section>
<!-- Footer / Secondary Links -->
<footer class="mt-12 w-full">
<div class="flex justify-between items-center text-[10px] uppercase tracking-widest font-label">
<a class="text-secondary hover:text-tertiary-fixed-variant transition-colors py-2 border-b border-transparent hover:border-tertiary-fixed-variant" href="#">Request Access</a>
<a class="text-secondary hover:text-tertiary-fixed-variant transition-colors py-2 border-b border-transparent hover:border-tertiary-fixed-variant" href="#">Recovery Terminal</a>
</div>
</footer>
</main>
<!-- Decorative Corner Element -->
<div class="fixed top-0 right-0 p-8 opacity-20 hidden md:block">
<div class="border-t border-r border-primary-container w-24 h-24"></div>
</div>
<div class="fixed bottom-0 left-0 p-8 opacity-20 hidden md:block">
<div class="border-b border-l border-primary-container w-24 h-24"></div>
</div>
<!-- Security Overlay Image (Minimal & Abstract) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.02]">
<img class="w-full h-full object-cover" data-alt="abstract architectural blueprint with subtle geometric lines and deep navy blue tones in high-end financial aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCytyYweZUJZs50RT1H8U08XE00--pmc-RbcMeWX4C9kT0mD4KTbKGK8_z6A65BB9LIZB5uSs9S88l0eXK3zyYypHNlSs-pYJmULSrfL1lPFvmvl5y1KJ9y-a6jvQgKj4FEWMQ_zIse2Rlb4EPCce-Isp46mpGENB6UFTlHJRTJpB8Qa3nxA8q7dNrV1A5Dofhsr-o51Js0QCkstDRNBa8fQ1byRo8SZ9mksW7hvurCYLUZCMnFaSl---j5TA1pdsCtIdFGL88qEAI"/>
</div>
</body></html>
